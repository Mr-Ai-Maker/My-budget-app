<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ميزانيتي</title>

<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="style.css">

<meta name="theme-color" content="#0F9D58">

</head>

<body>

<header class="header">
    <h1>💰 ميزانيتي</h1>
    <p>إدارة أموالك بسهولة</p>
</header>

<section class="balance">

<h2>الرصيد الحالي</h2>

<div id="balance">
0 ريال
</div>

</section>

<section class="cards">

<div class="card income">
<h3>الدخل</h3>
<p id="income">0</p>
</div>

<div class="card expense">
<h3>المصروف</h3>
<p id="expense">0</p>
</div>

<div class="card invest">
<h3>الاستثمارات</h3>
<p id="investment">0</p>
</div>

</section>

<section class="buttons">

<button onclick="showForm()">

➕ إضافة عملية

</button>

</section>

<section id="form" class="hidden">

<h2>عملية جديدة</h2>

<input
type="number"
id="amount"
placeholder="المبلغ">

<select id="type">

<option value="income">دخل</option>

<option value="expense">مصروف</option>

<option value="investment">استثمار</option>

</select>

<select id="category">

<option>الالتزامات</option>

<option>الاستثمارات</option>

<option>الشخصية</option>

</select>

<input
type="text"
id="note"
placeholder="ملاحظة">

<button onclick="saveTransaction()">

حفظ

</button>

</section>

<section class="history">

<h2>

آخر العمليات

</h2>

<ul id="transactions">

</ul>

</section>

<script src="app.js"></script>

</body>

</html>
