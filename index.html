<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ميزانيتي</title>

<link rel="stylesheet" href="style.css">

<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
</head>

<body>

<header>

<h1>ميزانيتي💰</h1>

<p>✨ إدارة أموالك بسهولة ✨</p>

</header>

<div class="cards">

<div class="card balance">
<h2>💼 الرصيد الحالي</h2>
<h1 id="balance">0 ريال</h1>
</div>

<div class="card income">
<h2>💵 الدخل</h2>
<h1 id="income">0 ريال</h1>
</div>

<div class="card expense">
<h2>🛒 المصروفات</h2>
<h1 id="expense">0 ريال</h1>
</div>

<div class="card invest">
<h2>🌱 الاستثمارات</h2>
<h1 id="invest">0 ريال</h1>
</div>

</div>

<div class="add-box">

<h2>➕ إضافة عملية</h2>

<select id="type">

<option value="income">💵 دخل</option>

<option value="expense">🛒 مصروف</option>

<option value="invest">🌱 استثمار</option>

</select>

<input type="number" id="amount" placeholder="💵 المبلغ">

<input type="text" id="note" placeholder="📝 ملاحظة">

<button onclick="saveTransaction()">

💾 حفظ

</button>

</div>

<div class="history">

<h2>🕒 آخر العمليات</h2>

<ul id="history"></ul>

</div>

<script src="script.js"></script>

</body>
</html>
